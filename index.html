<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuoricino</title>
<meta name="theme-color" content="#D6336C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuoricino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light dark}body{padding-top:max(18px,env(safe-area-inset-top,0px))!important;min-height:100vh;min-height:100dvh;overscroll-behavior-y:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* Telefono: niente ritardo né zoom al doppio tocco, tocchi più comodi, testo mai troppo piccolo */
button,a,select,summary,[role=button],[data-act]{touch-action:manipulation}
button{-webkit-touch-callout:none}
.mini{min-height:36px;font-size:13px;padding:6px 12px}
.stat span,.sb small{font-size:12px}
#nav .in{max-width:calc(100% - 24px)}
#nav button{width:clamp(46px,16vw,56px)}
@media (max-width:360px){#app{gap:12px}.h2{font-size:24px}.btn{padding:0 14px}.stat b{font-size:28px}}
img{-webkit-user-drag:none}
/* Elenco partite e sfida del giorno */
.glist{display:flex;flex-direction:column;gap:8px}
.gl{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface)}
.gl.mine{border-color:var(--btn);background:var(--a-soft)}
.glo{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:4px;color:var(--ink);font:inherit;cursor:pointer;min-height:52px}
.glo.dcg{border:1.5px solid var(--line);border-radius:16px;background:var(--surface);padding:6px 12px 6px 6px;width:100%}
.glt{flex:1;min-width:0;line-height:1.25}
.gico.sm{width:42px;height:42px;font-size:22px;border-radius:13px}
.note.mn{color:var(--btn);font-weight:700}
.dc.cs.msn{background:linear-gradient(135deg,#E6D8FB,#FFD3E2);min-height:120px}
body.cover #app,body.cover #nav{visibility:hidden}
.qimg{display:block;max-width:100%;max-height:260px;border-radius:14px;margin-top:6px;object-fit:cover}
.qimg.ld{padding:18px;background:var(--surface2);color:var(--muted);text-align:center;font-size:14px}
.msg .qimg,.pill .qimg{max-height:200px}
.go2{flex:none;font:800 12px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--btn)}
</style>
</head>
<body>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Tema rosa: rosa = partner A, viola orchidea = partner B. Sfondo sfumato rosa→bianco, barra fluttuante in basso. */
:root{
  --bg:#FFF9FB; --g1:#FFC6DB; --g2:#FFE9F1; --surface:#FFFFFF; --surface2:#FCE3EC; --ink:#3B1630; --muted:#7D4F6A; --line:#F3CBDC;
  --a:#E0457A; --a-soft:#FDE0EA; --b:#8E5BDB; --b-soft:#EBE0FB; --btn:#D6336C;
  --good:#1B8A50; --warn:#B4531A; --rosed:#A81B55; --leaf:#3F9A69;
  --wa:#C2185B; --wb:#6D3FC9; --wink:#4A1B3A; --shadow:0 8px 24px rgba(168,27,85,.18);
  --c1:#FFD3E2; --c2:#E6D8FB; --c3:#7A1236; --c4:#FFE2C2;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F0E1A; --g1:#4A1A3C; --g2:#2A1224; --surface:#2D1626; --surface2:#3D1F34; --ink:#FFEAF2; --muted:#D3A8BE; --line:#5A2E4B;
    --a:#FF7DA8; --a-soft:#4F2236; --b:#B596FF; --b-soft:#35285A;
    --good:#4CCB84; --warn:#F0A066; --rosed:#FFD0E1; --leaf:#5CCB95; --wink:#3D1F34; --shadow:0 8px 24px rgba(0,0,0,.45);
    --c1:#5A2342; --c2:#3F2E6B; --c3:#8A1A44; --c4:#5C3A22; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1F0E1A; --g1:#4A1A3C; --g2:#2A1224; --surface:#2D1626; --surface2:#3D1F34; --ink:#FFEAF2; --muted:#D3A8BE; --line:#5A2E4B;
  --a:#FF7DA8; --a-soft:#4F2236; --b:#B596FF; --b-soft:#35285A;
  --good:#4CCB84; --warn:#F0A066; --rosed:#FFD0E1; --leaf:#5CCB95; --wink:#3D1F34; --shadow:0 8px 24px rgba(0,0,0,.45);
  --c1:#5A2342; --c2:#3F2E6B; --c3:#8A1A44; --c4:#5C3A22; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{
  background:var(--bg) linear-gradient(180deg,var(--g1) 0,var(--g2) 300px,var(--bg) 620px) no-repeat;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45; min-height:100vh;
  padding-block:18px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
h1,h2,h3,figure{font-family:var(--display);text-wrap:balance;letter-spacing:-.02em}
figure{margin:0}
button,input,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.h2{font-size:28px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:800 22px var(--display);letter-spacing:-.03em}
.ca{fill:var(--a)} .cb{fill:var(--b)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body)}
button.chip{cursor:pointer}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--a);flex:none}
.dot.B{background:var(--b)}
.hk{width:18px;height:18px;fill:currentColor;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;min-width:0}
.eyebrow{font:700 12px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:15px}
.note{color:var(--muted);font-size:14px}
.link{background:none;border:0;padding:0;color:var(--ink);font:600 15px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px}
.hdiv{display:flex;align-items:center;gap:12px;color:var(--a);opacity:.85}
.hdiv::before,.hdiv::after{content:"";flex:1;height:1px;background:var(--line)}
.hdiv svg{width:16px;height:16px;fill:currentColor}
.hdiv svg+svg{color:var(--b)}
.rosee{width:64px;height:64px;flex:none}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec h3{font-size:22px}

/* home: avatar + stato + distanza */
.duo{display:grid;grid-template-columns:1fr minmax(70px,1fr) 1fr;column-gap:4px;align-items:center;padding-top:4px}
.bubw{grid-row:1;display:flex;justify-content:center;min-height:46px;align-items:flex-end;padding-bottom:6px}
.bub{max-width:100%;padding:7px 12px;border-radius:16px 16px 16px 4px;background:var(--surface);border:1px solid var(--line);font:600 13px/1.2 var(--body);color:var(--ink);box-shadow:0 2px 8px rgba(168,27,85,.1);overflow-wrap:anywhere;text-align:center}
.bub.add{border-style:dashed;background:transparent;color:var(--muted);cursor:pointer;box-shadow:none}
.avw{grid-row:2;display:flex;justify-content:center}
.avb{position:relative;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.av{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--a);color:#fff;font:800 34px var(--display);border:4px solid var(--surface);box-shadow:0 4px 14px rgba(168,27,85,.25)}
.av.B{background:var(--b)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.s{width:46px;height:46px;font-size:20px;border-width:2px}
.av.m{width:60px;height:60px;font-size:24px;border-width:3px}
.ringy{padding:3px;border-radius:50%;background:conic-gradient(var(--a),var(--b),var(--a));display:inline-block}
.ringy .av{border-color:var(--surface)}
.plus{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;font:700 20px/1 var(--body);border:3px solid var(--surface)}
.dn{grid-row:3;text-align:center;font:700 14px var(--body);padding-top:6px}
.mid{grid-row:2;grid-column:2;position:relative;height:84px;display:flex;align-items:center;justify-content:center}
.mid::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2.5px dashed var(--a);opacity:.55}
.dist{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:700 13px var(--body);color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(168,27,85,.12);font-variant-numeric:tabular-nums}
.dist svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);min-width:0}
.stat b{display:block;font:800 34px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

.timer{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.streak{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--body);padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.streak .hk{color:var(--a);width:14px;height:14px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dc{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:178px;padding:16px;border-radius:24px;border:0;text-align:left;color:var(--ink);cursor:pointer;font-family:var(--body);min-width:0}
.dc.c1{background:var(--c1)} .dc.c2{background:var(--c2)} .dc.c3{background:var(--c3);color:#fff} .dc.cg{background:var(--c4)}
.dc h3{font-size:19px;line-height:1.1}
.dc .tg{display:inline-block;font:800 11px var(--body);letter-spacing:.06em;padding:2px 7px;border-radius:7px;background:#fff;color:var(--c3);margin-bottom:6px}
.dc .ft{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.dc .go{font:800 12px var(--body);letter-spacing:.06em;display:inline-flex;align-items:center;gap:5px}
.dc .go svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dc.lock{filter:saturate(.6)}
.avs{display:flex}
.avs .ca2{position:relative;margin-left:-8px}
.avs .ca2:first-child{margin-left:0}
.ckb{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--good);display:grid;place-items:center;border:2px solid #fff}
.ckb svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.nwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nc{min-height:120px;padding:16px;border-radius:22px;background:var(--b-soft);display:flex;flex-direction:column;gap:6px;border:0;text-align:left;color:var(--ink);font-family:var(--body);overflow-wrap:anywhere;cursor:pointer;min-width:0}
.nc.mine{background:var(--a-soft)}
.nc.add{background:transparent;border:2px dashed var(--line);align-items:center;justify-content:center;text-align:center;color:var(--muted);font-weight:600}
.nc .who{font:700 12px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.nc p{font-size:15px;font-weight:600}

.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.qtext{font:700 22px/1.2 var(--display);letter-spacing:-.02em;margin-bottom:14px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;min-height:52px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:500 16px/1.3 var(--body);cursor:pointer}
.opt:hover{border-color:var(--me,var(--btn))}
.opt.sel{border-color:var(--me,var(--btn));background:var(--surface2);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:0;background:var(--btn);color:#fff;font:700 16px var(--body);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.btn .hk{width:16px;height:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--a-soft);min-width:0}
.pill.B{background:var(--b-soft)}
.pill .who{font:700 13px var(--body);flex:none}
.pill .val{min-width:0;overflow-wrap:anywhere}
.pill.wait{background:var(--surface2);color:var(--muted)}
.pairs{display:flex;flex-direction:column;gap:8px}
.verdict{display:flex;align-items:center;gap:6px;font:700 14px var(--body);margin-top:10px}
.verdict.eq{color:var(--a)} .verdict.ne{color:var(--muted)}
.ck{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.packs{display:flex;flex-direction:column;gap:12px}
.pack h3{font-size:21px;display:flex;align-items:center;gap:8px}
.pack h3 .hk{color:var(--a);width:20px;height:20px}
.pack.hot h3 .hk{color:#B0123F}
.pack .blurb{color:var(--muted);margin:2px 0 12px}
.bars{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.bar{display:grid;grid-template-columns:76px 1fr 40px;align-items:center;gap:10px;font:600 13px var(--body);font-variant-numeric:tabular-nums}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--a)}
.track.B i{background:var(--b)}
.bar .n{text-align:right;color:var(--muted)}
.tag{display:inline-block;margin-bottom:10px;font:700 12px var(--body);padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.hot{background:#7A1236;color:#fff}
.segs{display:flex;gap:6px;margin-bottom:18px}
.seg{height:6px;flex:1;border-radius:99px;background:var(--surface2)}
.seg.done{background:var(--ink)} .seg.cur{background:var(--me,var(--btn))}
.run{--me:var(--a)} .run.B{--me:var(--b)}
.ring{display:block;margin:0 auto 8px;width:min(280px,100%);height:auto}
.rc{text-align:center}
.rc .pct{font:800 40px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.qrow .qt{font:700 17px/1.3 var(--display);margin-bottom:10px;letter-spacing:-.01em}
.lockcard{display:flex;align-items:center;gap:14px;background:var(--surface2);border:1px dashed var(--line)}

/* ---- Giochi: Forza 4 ---- */
.c4{--bd:#5b4bd6;--bd2:#3b2fa8;display:grid;grid-template-columns:repeat(var(--C,7),1fr);gap:5px;padding:10px;border-radius:22px;background:linear-gradient(160deg,var(--bd),var(--bd2));box-shadow:0 10px 26px rgba(59,47,168,.3),inset 0 2px 0 rgba(255,255,255,.25);max-width:440px;margin:6px auto 4px;width:100%}
.c4.hot{--bd:#a8305c;--bd2:#5a1230;box-shadow:0 10px 26px rgba(122,18,54,.4),inset 0 2px 0 rgba(255,255,255,.2)}
.c4col{display:grid;grid-template-rows:repeat(var(--R,6),1fr);gap:5px;border:0;padding:0;background:transparent;cursor:pointer;min-width:0;border-radius:12px;-webkit-tap-highlight-color:transparent}
.c4col:active:not(:disabled){background:rgba(255,255,255,.14)}
.c4col:disabled{cursor:default}
.disc{display:block;aspect-ratio:1/1;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(0,0,0,.34),rgba(0,0,0,.5));box-shadow:inset 0 3px 6px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.22);position:relative}
.disc.A,.disc.B{box-shadow:inset 0 -5px 8px rgba(0,0,0,.28),inset 0 4px 5px rgba(255,255,255,.55),0 2px 4px rgba(0,0,0,.35)}
.disc.A{background:radial-gradient(circle at 35% 30%,#ffc2d8,#ff5c8a 55%,#d6336c)}
.disc.B{background:radial-gradient(circle at 35% 30%,#fff3c4,#ffd04d 55%,#f0a30a)}
.disc.A::after,.disc.B::after{content:"";position:absolute;inset:22%;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.disc.drop{animation:c4fall .55s cubic-bezier(.3,.1,.5,1) both;z-index:2}
@keyframes c4fall{0%{transform:translateY(calc(var(--fall,3)*-115%))}55%{transform:translateY(0)}72%{transform:translateY(-14%)}86%{transform:translateY(0)}93%{transform:translateY(-4%)}100%{transform:translateY(0)}}
.disc.slide{animation:c4slide .35s ease-out both}
@keyframes c4slide{from{transform:translateY(-110%)}to{transform:translateY(0)}}
.disc.w{animation:c4win 1s ease-in-out infinite;z-index:3}
@keyframes c4win{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.14);filter:brightness(1.3) drop-shadow(0 0 8px #fff)}}
.c4pop{display:grid;grid-template-columns:repeat(var(--C,7),1fr);gap:5px;padding:0 10px;max-width:440px;margin:0 auto;width:100%}
.c4pb{min-height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px var(--body);cursor:pointer}
.c4pb:disabled{opacity:.25;cursor:default}
/* ---- Giochi: Battaglia navale ---- */
.bgrid{display:grid;grid-template-columns:repeat(var(--n,8),1fr);gap:0;max-width:380px;margin:6px auto;width:100%;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#4aa8e8,#1f6fb8);box-shadow:0 8px 20px rgba(31,111,184,.3),inset 0 0 0 2px rgba(255,255,255,.35)}
.bgrid.hot{background:linear-gradient(160deg,#c23c78,#5a1230);box-shadow:0 8px 20px rgba(122,18,54,.35),inset 0 0 0 2px rgba(255,255,255,.2)}
.bgrid.mini{max-width:230px}
.bc{aspect-ratio:1/1;border:0;padding:0;margin:0;background:transparent;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.28);display:grid;place-items:center;cursor:pointer;font-size:clamp(11px,4vw,20px);line-height:1;color:#fff;position:relative;min-width:0}
.bc:disabled{cursor:default}
.bgrid.mini .bc{font-size:clamp(8px,2.6vw,13px)}
.bc.sh{background:linear-gradient(180deg,#5d7a96,#34506b);box-shadow:none}
.bc.sh.hotg,.bc.sunk.hotg{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.28)}
.bc.sh.h.s{border-radius:99px 4px 4px 99px} .bc.sh.h.e{border-radius:4px 99px 99px 4px} .bc.sh.v.s{border-radius:99px 99px 4px 4px} .bc.sh.v.e{border-radius:4px 4px 99px 99px} .bc.sh.m{border-radius:4px}
.bc.sunk{background:linear-gradient(180deg,#c2415f,#7a1a33)}
.bc.miss::after{content:"";width:46%;height:46%;border-radius:50%;border:2.5px solid rgba(255,255,255,.9);animation:ripple .6s ease-out}
@keyframes ripple{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

.q20l .qn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--a-soft);display:grid;place-items:center;font:700 12px var(--body)}
.q20l .qt{flex:1}
.q20l .qa{font-weight:800;color:var(--muted)}
.q20l li.a-y .qa{color:var(--good)}.q20l li.a-n .qa{color:var(--warn)}
.q20l li.empty{justify-content:center;color:var(--muted)}

.stories.one{justify-content:center;overflow:visible}
.bigheart{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:var(--ink);cursor:pointer;font:inherit;padding:4px 10px}
.hrt3{position:relative;width:132px;height:120px;display:grid;place-items:center}
.hrt3>svg{position:absolute;inset:0;width:100%;height:100%;fill:var(--a-soft);stroke:var(--a);stroke-width:1;filter:drop-shadow(0 6px 12px rgba(214,51,108,.28))}
.bigheart.live .hrt3>svg{stroke:url(#none);stroke:var(--a);stroke-width:2;animation:hb 1.6s ease-in-out infinite}
.hrt3 .ia{position:relative;display:flex;margin-top:-6px}
.hrt3 .ia>*{width:48px;height:48px;font-size:20px;border:2.5px solid #fff;box-sizing:border-box}
.hrt3 .ia>*+*{margin-left:-14px}
.hn{font:600 17px var(--display)}.hn i{color:var(--a);font-style:normal}
@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.duoprof{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duoprof .pp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px;border-radius:16px;background:var(--surface2);text-align:center}
</style>
